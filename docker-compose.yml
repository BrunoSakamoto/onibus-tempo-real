# Sobe tudo: Kafka, PostgreSQL, produtor, processador e painel (http://localhost:8000).
#   docker compose up --build
# Sem internet ou para uma demonstração, reproduza a gravação incluída no projeto:
#   FONTE=gravacao docker compose up --build

x-app: &app
  build: .
  restart: unless-stopped
  environment:
    KAFKA_SERVIDORES: kafka:9092
    DATABASE_URL: postgresql://onibus:onibus@postgres:5432/onibus
    FONTE: ${FONTE:-rio}
    INTERVALO_SEGUNDOS: ${INTERVALO_SEGUNDOS:-30}
    SPTRANS_TOKEN: ${SPTRANS_TOKEN:-}
  depends_on:
    kafka:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNO://:9092,CONTROLLER://:9093,EXTERNO://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka:9092,EXTERNO://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNO:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNO:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9094:9094"  # para rodar produtor ou processador fora do Docker: KAFKA_SERVIDORES=localhost:9094
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: onibus
      POSTGRES_PASSWORD: onibus
      POSTGRES_DB: onibus
    ports:
      - "5432:5432"
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onibus"]
      interval: 3s
      timeout: 3s
      retries: 20

  produtor:
    <<: *app
    command: ["python", "-m", "onibus", "produtor"]

  processador:
    <<: *app
    command: ["python", "-m", "onibus", "processador"]

  painel:
    <<: *app
    command: ["python", "-m", "onibus", "painel"]
    ports:
      - "8000:8000"

volumes:
  dados:
